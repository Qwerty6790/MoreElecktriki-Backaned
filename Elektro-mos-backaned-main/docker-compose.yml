version: '3.8'

services:
  backend:
    build: ./web-app-service
    container_name: elektro-mos-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3007
    ports:
      - "3007:3007"
    volumes:
      - ./web-app-service/uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - elektro-network

networks:
  elektro-network:
    driver: bridge