version: '3.8'

services:
  backend:
    build: ./web-app-service
    container_name: elektro-mos-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3007
    ports:
      - "3007:3007"
    volumes:
      - ./web-app-service/uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - elektro-network

  nginx:
    image: nginx:alpine
    container_name: elektro-mos-nginx
    restart: unless-stopped
    ports:
      - "9443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites-available:/etc/nginx/sites-available
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - elektro-network

networks:
  elektro-network:
    driver: bridge